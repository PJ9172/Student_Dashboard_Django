{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>

    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">

    <style>
        .delete-box {
            width: 500px;
            margin: 100px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        .student-details {
            margin: 20px 0;
            text-align: left;
        }

        .student-details p {
            margin: 10px 0;
            font-size: 18px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .delete-btn {
            background-color: red;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-btn {
            background-color: gray;
            color: white;
            padding: 10px 25px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <form method="post">
        {% csrf_token %}

        <div class="delete-box">

            <h1>Delete Student</h1>

            <p>Are you sure you want to delete this student?</p>

            <div class="student-details">
                <p><strong>Name:</strong> {{ student.name }}</p>
                <p><strong>Phone:</strong> {{ student.number }}</p>
                <p><strong>Email:</strong> {{ student.email }}</p>
                <p><strong>Percentage:</strong> {{ student.percentage }}</p>
            </div>

            <div class="btn-group">
                <button type="submit" class="delete-btn">
                    DELETE
                </button>

                <a href="/dashboard/" class="cancel-btn">
                    CANCEL
                </a>
            </div>

        </div>

    </form>

</body>

</html>
